<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Casa and Crop</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0C0D0F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /*  Deliberately self-contained: a 404 that depends on the asset
          graph will fail exactly when it is needed. Values are the
          site's tokens, quoted by hand. Grain is the one asset it
          borrows, and it degrades to a flat ground without it. */
      @view-transition {
        navigation: auto;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 1.2rem;
        background-color: #0c0d0f;
        background-image: url('/grain.png');
        background-repeat: repeat;
        background-size: 128px 128px;
        color: #eeedea;
        font-family: 'Schibsted Grotesk', system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(4rem, 18vw, 12rem);
        font-weight: 620;
        line-height: 0.9;
        letter-spacing: -0.032em;
        background: linear-gradient(145deg, #d8c7a6, #a28d6c 55%, #877254);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0;
        color: #9a9b9e;
        font-size: 1rem;
      }
      a {
        color: #c9b191;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.25em;
        transition: text-underline-offset 200ms cubic-bezier(0.32, 0.08, 0.24, 1);
      }
      a:hover {
        text-underline-offset: 0.4em;
      }
      ::selection {
        background: #1a1d21;
      }
      :focus-visible {
        outline: 2px solid #c9b191;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: no-preference) {
        h1,
        p {
          animation: rise 900ms cubic-bezier(0.22, 0.68, 0.12, 1) both;
        }
        p {
          animation-delay: 140ms;
        }
        p + p {
          animation-delay: 260ms;
        }
        @keyframes rise {
          from {
            opacity: 0;
            transform: translateY(1.1rem);
          }
        }
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>Nothing is cast at this address.</p>
    <p><a href="/">Return to the threshold</a> · <a href="/collections.html">Collections</a></p>
  </body>
</html>
