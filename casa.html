<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="view-transition" content="same-origin" />

    <title>Casa — Casa and Crop</title>
    <meta
      name="description"
      content="Casa — six ranges of home metalware, cast, machined and finished in our own Moradabad works. Brass, copper, steel and eight further materials, exported to 34 countries."
    />

    <!-- Paints the page surface before any CSS arrives, so the first frame
         is never a white flash against our warm palette. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Casa — Casa and Crop" />
    <meta property="og:description" content="Six ranges of home metalware, cast and finished in our own works." />
    <meta name="theme-color" content="#0C0D0F" />
    <meta property="og:image" content="https://casaandcrop.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://casaandcrop.com/og.png" />

    <!-- Font preloads land here once the typefaces are chosen. Deliberately
         empty for now: an unused preload is a wasted round trip. -->

    <!-- The landing's base plate (the room dark) is the LCP; preload it
         in AVIF at the width the responsive <img> will pick. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/hero/f1-1600.avif"
      imagesrcset="/hero/f1-900.avif 900w, /hero/f1-1600.avif 1600w"
      imagesizes="100vw"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/schibsted-grotesk-latin.woff2"
      crossorigin
    />
    <!-- The likely next documents are prerendered on hover, so a click
         starts the page transition on the next frame - and the incoming
         snapshot is of a finished page, which is what lets named
         elements morph across documents. Chrome-only; elsewhere this
         block is inert text. -->
    <script type="speculationrules">
      {
        "prerender": [
          { "where": { "href_matches": "/*" }, "eagerness": "moderate" }
        ]
      }
    </script>

    <!-- Classifies each arrival for the transition grammar: the
         browser's back button sweeps the page in from the other side. -->
    <script>
      addEventListener('pagereveal', (e) => {
        if (!e.viewTransition || !self.navigation || !navigation.activation) return
        const { navigationType, entry, from } = navigation.activation
        const back =
          navigationType === 'traverse' && from && entry.index < from.index
        e.viewTransition.types.clear()
        e.viewTransition.types.add(back ? 'back' : 'forward')
      })
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/casa.jsx"></script>
  </body>
</html>
