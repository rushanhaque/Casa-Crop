    <!-- Marks that scripting is available, before the first paint.
         Every hidden-until-revealed rule is scoped to .js, so if this
         line never runs the page renders fully visible instead of
         blank. Inline and in <head> deliberately: loaded as a separate
         file it would arrive after paint and the revealed content
         would flash before hiding itself. -->
    <script>
      document.documentElement.classList.add('js')
    </script>
      <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/schibsted-grotesk-latin.woff2"
      crossorigin
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
