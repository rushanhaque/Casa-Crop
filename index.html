<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="view-transition" content="same-origin" />

    <title>Casa and Crop</title>
    <meta
      name="description"
      content="Casa and Crop — manufacturers and exporters of home metalware in brass, copper and steel, from Moradabad to 34 countries. Casa is the house; Crop, the land, arrives soon."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Casa and Crop" />
    <meta property="og:description" content="Manufacturers and exporters of home metalware — Moradabad to 34 countries." />
    <!-- Paints the page surface before any CSS arrives, so the first frame is
         never a white flash ahead of a near-black ground. Mirrors --c-surface. -->
    <meta name="theme-color" content="#0C0D0F" />
    <meta property="og:image" content="https://casaandcrop.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://casaandcrop.com/og.png" />

    <!-- Preload the two cover images and the single above-the-fold webfont so
         they are already in flight before the module script parses. -->
    <link rel="preload" as="image" href="/casa-cover.avif" type="image/avif" />
    <link rel="preload" as="image" href="/crop-cover.avif" type="image/avif" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/schibsted-grotesk-latin.woff2"
      crossorigin
    />
    <!-- The likely next documents are prerendered on hover, so a click
         starts the page transition on the next frame - and the incoming
         snapshot is of a finished page, which is what lets named
         elements morph across documents. Chrome-only; elsewhere this
         block is inert text. -->
    <script type="speculationrules">
      {
        "prerender": [
          { "where": { "href_matches": "/*" }, "eagerness": "moderate" }
        ]
      }
    </script>

    <!-- Classifies each arrival for the transition grammar: the
         browser's back button sweeps the page in from the other side. -->
    <script>
      addEventListener('pagereveal', (e) => {
        if (!e.viewTransition || !self.navigation || !navigation.activation) return
        const { navigationType, entry, from } = navigation.activation
        const back =
          navigationType === 'traverse' && from && entry.index < from.index
        e.viewTransition.types.clear()
        e.viewTransition.types.add(back ? 'back' : 'forward')
      })
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
